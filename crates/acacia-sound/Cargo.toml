[package]
name = "acacia-sound"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Game sounds for an Acacia client: Bedrock sound definitions, FSB5/FADPCM and Ogg decoding, positional playback"

[dependencies]
lewton = "0.10"
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[features]
default = ["playback"]
# Sound through the default audio device (rodio; on Linux it builds against ALSA's headers).
# Without it, events still resolve and samples decode, and playing is silent.
playback = ["dep:rodio"]

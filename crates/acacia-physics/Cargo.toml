[package]
name = "acacia-physics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minecraft: Bedrock Edition player movement simulation"
repository.workspace = true
rust-version.workspace = true

[features]
# `registry_world`: the `WorldView` of a chunk view or a server's level, from acacia-world's registry.
acacia-world = ["dep:acacia-world"]
# Sine and cosine from the platform's own C runtime, as a client running on that platform computes
# them, instead of the port of glibc's that matches a Linux server everywhere. On Windows that is the
# runtime the vanilla client imports `sinf` and `cosf` from. On Linux it is glibc: the same bits.
system-sinf = []

[dependencies]
acacia-world = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
